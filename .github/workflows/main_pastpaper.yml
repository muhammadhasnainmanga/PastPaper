
name: Build and deploy Node.js backend to Azure Web App - pastpaper

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_pastpaper.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install Production dependencies
        run: npm ci --omit=dev
        working-directory: ./backend

      - name: Run tests
        run: npm run test --if-present
        working-directory: ./backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2892D98AB6594797BD96C17F26F12726 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_517E0D36035A4DC394445A513AD0028D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AFA5FE3CB4E6430E9DB29C0A76425BBF }}

      - name: Deploy backend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: pastpaper
          slot-name: Production
          package: ./backend
